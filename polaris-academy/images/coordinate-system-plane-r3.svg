<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Coordinates on a plane in three-dimensional space</title>
  <desc id="desc">A plane H through the origin is spanned by basis vectors v one and v two. The point x is two v one plus three v two, so its coordinates in this basis are two and three.</desc>
  <defs>
    <pattern id="paper-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#eceff0" stroke-width="1"/></pattern>
    <marker id="blue-arrow" viewBox="0 0 11 11" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#3f7897"/></marker>
    <marker id="rust-arrow" viewBox="0 0 11 11" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#c17b52"/></marker>
    <marker id="dark-arrow" viewBox="0 0 11 11" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#39444b"/></marker>
    <clipPath id="plane-clip"><path d="M45 90L385 170L543 462L203 383Z"/></clipPath>
  </defs>
  <rect width="900" height="540" fill="#fff"/>
  <rect width="900" height="540" fill="url(#paper-grid)"/>
  <path d="M45 90L385 170L543 462L203 383Z" fill="#dcebf0" fill-opacity=".56" stroke="#6e8791" stroke-width="2.5"/>
  <g clip-path="url(#plane-clip)" fill="none" stroke="#a7c3cd" stroke-width="1.2">
    <path d="M202.5 382.5L542.5 462.5M185 350L525 430M167.5 317.5L507.5 397.5M150 285L490 365M132.5 252.5L472.5 332.5M115 220L455 300M97.5 187.5L437.5 267.5M80 155L420 235M62.5 122.5L402.5 202.5M45 90L385 170"/>
    <path d="M202.5 382.5L45 90M287.5 402.5L130 110M372.5 422.5L215 130M457.5 442.5L300 150M542.5 462.5L385 170"/>
  </g>
  <text x="500" y="198" font-family="Cambria, Georgia, serif" font-size="27" font-style="italic" fill="#303a40">H</text>
  <line x1="270" y1="370" x2="270" y2="63" stroke="#59666c" stroke-width="2.2" marker-end="url(#dark-arrow)"/>
  <line x1="270" y1="370" x2="620" y2="452" stroke="#59666c" stroke-width="2.2" marker-end="url(#dark-arrow)"/>
  <line x1="270" y1="370" x2="108" y2="30" stroke="#59666c" stroke-width="2.2" marker-end="url(#dark-arrow)"/>
  <text x="257" y="54" font-family="Cambria, Georgia, serif" font-size="20" font-style="italic" fill="#59666c">x₃</text>
  <text x="630" y="460" font-family="Cambria, Georgia, serif" font-size="20" font-style="italic" fill="#59666c">x₂</text>
  <text x="91" y="26" font-family="Cambria, Georgia, serif" font-size="20" font-style="italic" fill="#59666c">x₁</text>
  <line x1="440" y1="410" x2="335" y2="215" stroke="#3f7897" stroke-width="2.2" stroke-dasharray="7 7"/>
  <line x1="165" y1="175" x2="335" y2="215" stroke="#c17b52" stroke-width="2.2" stroke-dasharray="7 7"/>
  <line x1="270" y1="370" x2="355" y2="390" stroke="#3f7897" stroke-width="3.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
  <line x1="270" y1="370" x2="235" y2="305" stroke="#c17b52" stroke-width="3.5" stroke-linecap="round" marker-end="url(#rust-arrow)"/>
  <line x1="270" y1="370" x2="335" y2="215" stroke="#39444b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#dark-arrow)"/>
  <circle cx="270" cy="370" r="5" fill="#303a40"/>
  <circle cx="335" cy="215" r="8" fill="#39444b" stroke="#fff" stroke-width="2"/>
  <text x="360" y="398" font-family="Cambria, Georgia, serif" font-size="21" font-style="italic" fill="#356d8a">v₁</text>
  <text x="218" y="298" font-family="Cambria, Georgia, serif" font-size="21" font-style="italic" fill="#ad6945">v₂</text>
  <text x="348" y="205" font-family="Cambria, Georgia, serif" font-size="21" font-style="italic" fill="#303a40">x = 2v₁ + 3v₂</text>
  <text x="279" y="393" font-family="Cambria, Georgia, serif" font-size="18" fill="#303a40">0</text>
  <rect x="665" y="210" width="205" height="105" rx="8" fill="#fff" stroke="#cbd3d6" stroke-width="1.5"/>
  <text x="767" y="250" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="21" fill="#303a40">[x]ᵦ = (2, 3)ᵀ</text>
  <text x="767" y="284" text-anchor="middle" font-family="Cambria, Georgia, serif" font-size="17" fill="#59666c">coordinates within H</text>
</svg>
