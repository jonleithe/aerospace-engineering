<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="title desc">
  <title id="title">Standard matrix for a counterclockwise rotation</title>
  <desc id="desc">The standard basis vectors e1 and e2 rotate counterclockwise through phi. Their images are the columns (cos phi, sin phi) and (-sin phi, cos phi), shown on the unit circle.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eef1f2" stroke-width="1"/>
    </pattern>
    <marker id="axis-arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#4b555b"/>
    </marker>
    <marker id="e1-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#39779a"/>
    </marker>
    <marker id="e2-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#bd7049"/>
    </marker>
  </defs>

  <rect width="700" height="460" fill="#ffffff"/>
  <rect width="700" height="460" fill="url(#grid)"/>

  <!-- A unit-circle arc shows that rotation preserves vector length. -->
  <path d="M510 320A160 160 0 0 0 190 320" fill="none" stroke="#b36f9e" stroke-width="1.8" stroke-dasharray="5 6"/>

  <g fill="none" stroke="#4b555b" stroke-width="1.5">
    <path d="M105 320H590" marker-end="url(#axis-arrow)"/>
    <path d="M350 405V70" marker-end="url(#axis-arrow)"/>
  </g>

  <!-- Images of e1 and e2 for the illustrative angle phi = 35 degrees. -->
  <line x1="350" y1="320" x2="481" y2="228" stroke="#39779a" stroke-width="2.5" marker-end="url(#e1-arrow)"/>
  <line x1="350" y1="320" x2="258" y2="189" stroke="#bd7049" stroke-width="2.5" marker-end="url(#e2-arrow)"/>

  <path d="M397 320A47 47 0 0 0 388.5 293.1" fill="none" stroke="#39779a" stroke-width="1.7"/>
  <path d="M350 273A47 47 0 0 0 323.1 281.5" fill="none" stroke="#bd7049" stroke-width="1.7"/>

  <g fill="#303a40" font-family="Cambria, Georgia, serif" font-size="20">
    <text x="592" y="326" font-style="italic">x₁</text>
    <text x="358" y="76" font-style="italic">x₂</text>
    <text x="337" y="345" font-size="16">O</text>
    <text x="520" y="350" font-size="18">e₁ = (1, 0)</text>
    <text x="365" y="164" font-size="18">e₂ = (0, 1)</text>
  </g>

  <g font-family="Cambria Math, Cambria, Georgia, serif" font-size="18" font-style="italic">
    <text x="405" y="298" fill="#39779a">φ</text>
    <text x="306" y="277" fill="#bd7049">φ</text>
    <text x="490" y="215" fill="#39779a">(cos φ, sin φ)</text>
    <text x="92" y="178" fill="#bd7049">(−sin φ, cos φ)</text>
  </g>

  <circle cx="481" cy="228" r="3.5" fill="#39779a"/>
  <circle cx="258" cy="189" r="3.5" fill="#bd7049"/>
</svg>
