<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Discrete-time signal</title>
  <desc id="desc">A sequence is shown as separate samples at integer indices, with positive and negative values relative to zero.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#eceff0" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#465158"/></marker>
  </defs>
  <rect width="900" height="500" fill="#fff"/>
  <rect width="900" height="500" fill="url(#grid)"/>
  <line x1="105" y1="270" x2="800" y2="270" stroke="#465158" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="425" x2="420" y2="70" stroke="#465158" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g stroke="#477f9a" stroke-width="4" stroke-linecap="round" fill="#477f9a">
    <line x1="180" y1="270" x2="180" y2="270"/><circle cx="180" cy="270" r="5"/>
    <line x1="240" y1="270" x2="240" y2="228"/><circle cx="240" cy="228" r="5"/>
    <line x1="300" y1="270" x2="300" y2="186"/><circle cx="300" cy="186" r="5"/>
    <line x1="360" y1="270" x2="360" y2="144"/><circle cx="360" cy="144" r="5"/>
    <line x1="420" y1="270" x2="420" y2="123"/><circle cx="420" cy="123" r="5"/>
    <line x1="480" y1="270" x2="480" y2="165"/><circle cx="480" cy="165" r="5"/>
    <line x1="540" y1="270" x2="540" y2="207"/><circle cx="540" cy="207" r="5"/>
    <line x1="600" y1="270" x2="600" y2="270"/><circle cx="600" cy="270" r="5"/>
    <line x1="660" y1="270" x2="660" y2="309"/><circle cx="660" cy="309" r="5"/>
    <line x1="720" y1="270" x2="720" y2="333"/><circle cx="720" cy="333" r="5"/>
  </g>
  <g stroke="#647078" stroke-width="1.5">
    <path d="M180 264v12M300 264v12M420 264v12M540 264v12M660 264v12M780 264v12"/>
  </g>
  <g font-family="Cambria, Georgia, serif" font-size="21" fill="#465158" text-anchor="middle">
    <text x="180" y="304">−4</text><text x="300" y="304">−2</text><text x="395" y="304">0</text>
    <text x="540" y="304">2</text><text x="660" y="304">4</text>
  </g>
  <text x="810" y="278" font-family="Cambria, Georgia, serif" font-size="26" font-style="italic" fill="#303a40">k</text>
  <text x="432" y="87" font-family="Cambria, Georgia, serif" font-size="26" font-style="italic" fill="#303a40">yₖ</text>
</svg>
