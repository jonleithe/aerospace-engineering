<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">The x1 x2 coordinate plane in R3</title>
  <desc id="desc">The shaded plane x3 equals zero passes through the origin and is a subspace of three-dimensional space.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#eceff0" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39444b"/></marker>
  </defs>
  <rect width="900" height="540" fill="#fff"/>
  <rect width="900" height="540" fill="url(#grid)"/>
  <path d="M435 149L765 221L465 431L135 359Z" fill="#b9d9c2" fill-opacity=".62" stroke="#4f8062" stroke-width="2.5"/>
  <line x1="450" y1="290" x2="225" y2="448" stroke="#39444b" stroke-width="2.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="290" x2="790" y2="365" stroke="#39444b" stroke-width="2.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="290" x2="450" y2="58" stroke="#39444b" stroke-width="2.6" marker-end="url(#arrow)"/>
  <circle cx="450" cy="290" r="5.5" fill="#303a40"/>
  <text x="463" y="311" font-family="Cambria, Georgia, serif" font-size="23" fill="#303a40">0</text>
  <text x="185" y="470" font-family="Cambria, Georgia, serif" font-size="25" font-style="italic" fill="#303a40">x₁</text>
  <text x="797" y="378" font-family="Cambria, Georgia, serif" font-size="25" font-style="italic" fill="#303a40">x₂</text>
  <text x="462" y="58" font-family="Cambria, Georgia, serif" font-size="25" font-style="italic" fill="#303a40">x₃</text>
  <text x="516" y="360" font-family="Cambria, Georgia, serif" font-size="29" font-style="italic" fill="#3f7052">H</text>
  <text x="568" y="112" font-family="Cambria, Georgia, serif" font-size="22" fill="#52635a">x₃ = 0</text>
</svg>
