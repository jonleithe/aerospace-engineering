<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">A line in R2 that is not a subspace</title>
  <desc id="desc">The line H has a negative slope and does not pass through the origin of the x1 x2 coordinate system.</desc>
  <defs>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#eceff0" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 11 11" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#39444b"/></marker>
  </defs>
  <rect width="900" height="500" fill="#fff"/>
  <rect width="900" height="500" fill="url(#grid)"/>
  <line x1="110" y1="315" x2="800" y2="315" stroke="#39444b" stroke-width="2.6" marker-end="url(#arrow)"/>
  <line x1="400" y1="435" x2="400" y2="70" stroke="#39444b" stroke-width="2.6" marker-end="url(#arrow)"/>
  <line x1="210" y1="145" x2="690" y2="390" stroke="#477f9a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="400" cy="315" r="5.5" fill="#303a40"/>
  <text x="375" y="348" font-family="Cambria, Georgia, serif" font-size="23" fill="#303a40">0</text>
  <text x="810" y="323" font-family="Cambria, Georgia, serif" font-size="25" font-style="italic" fill="#303a40">x₁</text>
  <text x="412" y="72" font-family="Cambria, Georgia, serif" font-size="25" font-style="italic" fill="#303a40">x₂</text>
  <text x="642" y="378" font-family="Cambria, Georgia, serif" font-size="28" font-style="italic" fill="#356d8a">H</text>
</svg>
